<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Woven plastic webbing pattern in Jagruti Plastic brand colours" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="weave" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#202020"/>
      <!-- cell A: red vertical under, gold horizontal over -->
      <rect x="6" y="0" width="28" height="40" fill="#D92732"/>
      <rect x="0" y="6" width="40" height="28" fill="#B88A4B"/>
      <!-- cell B: gold horizontal under, red vertical over -->
      <rect x="40" y="6" width="40" height="28" fill="#B88A4B"/>
      <rect x="46" y="0" width="28" height="40" fill="#D92732"/>
      <!-- cell C: gold horizontal under, red vertical over -->
      <rect x="0" y="46" width="40" height="28" fill="#B88A4B"/>
      <rect x="6" y="40" width="28" height="40" fill="#D92732"/>
      <!-- cell D: red vertical under, gold horizontal over -->
      <rect x="46" y="40" width="28" height="40" fill="#D92732"/>
      <rect x="40" y="46" width="40" height="28" fill="#B88A4B"/>
    </pattern>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="640" fill="#F7F7F7"/>
  <rect x="48" y="48" width="704" height="544" fill="url(#weave)"/>
  <rect x="48" y="48" width="704" height="544" fill="url(#shade)"/>
  <path d="M24 200V24h176" fill="none" stroke="#D92732" stroke-width="10"/>
  <path d="M776 440v176H600" fill="none" stroke="#B88A4B" stroke-width="10"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
